<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, sans-serif" font-size="13" fill="#1a1a1a">
  <defs>
    <g id="actor" stroke="#1a1a1a" stroke-width="1.6" fill="none">
      <circle cx="0" cy="-30" r="9"/><line x1="0" y1="-21" x2="0" y2="5"/>
      <line x1="-14" y1="-12" x2="14" y2="-12"/><line x1="0" y1="5" x2="-11" y2="24"/><line x1="0" y1="5" x2="11" y2="24"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#444"/></marker>
  </defs>
  <!-- frontière du système -->
  <rect x="170" y="12" width="390" height="306" rx="6" fill="#f7f9fc" stroke="#123f73" stroke-width="1.5"/>
  <text x="365" y="32" text-anchor="middle" font-weight="bold" fill="#123f73">Système ENSO Monitor</text>
  <!-- cas d'utilisation -->
  <g fill="#fff" stroke="#1f5fa8" stroke-width="1.3">
    <ellipse cx="290" cy="66" rx="92" ry="20"/><ellipse cx="290" cy="118" rx="92" ry="20"/>
    <ellipse cx="290" cy="170" rx="92" ry="20"/><ellipse cx="480" cy="66" rx="68" ry="22"/>
    <ellipse cx="290" cy="226" rx="92" ry="20"/><ellipse cx="430" cy="286" rx="100" ry="20"/>
  </g>
  <g text-anchor="middle">
    <text x="290" y="70">Consulter la courbe</text><text x="290" y="122">Lire le tableau des valeurs</text>
    <text x="290" y="174">Comparer deux épisodes</text><text x="480" y="62">Filtrer</text><text x="480" y="76">par période</text>
    <text x="290" y="230">Consulter la doc de l'API</text><text x="430" y="290">Importer la série NOAA</text>
  </g>
  <!-- extend -->
  <path d="M412,66 L384,66" stroke="#444" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="398" y="100" font-size="11" fill="#444" text-anchor="middle">«extend»</text>
  <!-- acteurs -->
  <use href="#actor" x="70" y="110"/><text x="70" y="152" text-anchor="middle" font-weight="bold">Visiteur</text>
  <use href="#actor" x="70" y="236"/><text x="70" y="278" text-anchor="middle" font-weight="bold">Développeur</text>
  <use href="#actor" x="660" y="240"/><text x="660" y="282" text-anchor="middle" font-weight="bold">Mainteneur</text>
  <g stroke="#1a1a1a" stroke-width="1.1">
    <line x1="86" y1="96" x2="198" y2="68"/><line x1="86" y1="100" x2="198" y2="118"/>
    <line x1="86" y1="104" x2="198" y2="168"/><line x1="86" y1="232" x2="198" y2="226"/>
    <line x1="644" y1="262" x2="530" y2="282"/>
  </g>
  <!-- système externe -->
  <rect x="600" y="36" width="140" height="48" fill="#fff" stroke="#666" stroke-dasharray="4 3"/>
  <text x="670" y="56" text-anchor="middle" font-size="12">«système externe»</text>
  <text x="670" y="73" text-anchor="middle" font-size="12" font-weight="bold">Fichier NOAA RONI</text>
  <path d="M500,272 C580,230 640,170 660,86" stroke="#444" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="628" y="168" font-size="11" fill="#444">lit</text>
</svg>
