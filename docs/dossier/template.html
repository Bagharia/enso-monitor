<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ENSO Monitor — Dossier de conception</title>
<style>
  @page {
    size: A4;
    margin: 15mm 15mm 16mm 15mm;
    @bottom-left { content: "ENSO Monitor — Dossier de conception"; font: 8pt Arial, sans-serif; color: #777; }
    @bottom-right { content: "Page " counter(page) " / " counter(pages); font: 8pt Arial, sans-serif; color: #777; }
  }
  @page :first { @bottom-left { content: none; } @bottom-right { content: none; } }
  body { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 9.4pt; line-height: 1.38; color: #1a1a1a; }
  h1 { font-size: 15pt; margin: 0 0 6px; padding-bottom: 3px; border-bottom: 2px solid #1f5fa8; color: #123f73; break-before: page; break-after: avoid; }
  h2 { font-size: 11pt; margin: 10px 0 4px; color: #123f73; break-after: avoid; }
  p { margin: 3px 0 5px; }
  ul { margin: 3px 0 6px; padding-left: 18px; }
  li { margin: 1px 0; }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; font-size: 8.4pt; break-inside: auto; }
  tr { break-inside: avoid; }
  th, td { border: 1px solid #c9d2dc; padding: 2px 5px; text-align: left; vertical-align: top; }
  th { background: #eef3f8; }
  code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 8pt; background: #f3f3f3; padding: 0 2px; }
  pre { font-size: 7.8pt; background: #f6f6f6; border: 1px solid #ddd; padding: 5px 8px; margin: 4px 0; white-space: pre-wrap; break-inside: avoid; }
  pre.mermaid { background: none; border: none; text-align: center; padding: 0; margin: 4px 0 6px; }
  pre.mermaid svg { max-width: 100%; height: auto; }
  figure img[src$=".svg"] { border: none; }
  figure { margin: 6px 0; text-align: center; break-inside: avoid; }
  figure img { border: 1px solid #ccc; }
  figcaption, .caption { font-size: 8pt; color: #555; text-align: center; margin-top: 2px; }
  blockquote { margin: 4px 0; padding: 3px 10px; border-left: 3px solid #1f5fa8; background: #f3f7fb; }
  .todo { background: #fff3cd; border: 1px dashed #c69500; padding: 4px 8px; font-weight: bold; }
  /* Couverture */
  .cover { height: 250mm; display: flex; flex-direction: column; justify-content: center; }
  .cover-kicker { color: #555; font-size: 10pt; letter-spacing: .3px; }
  .cover-title { font-size: 40pt; color: #123f73; border: none; margin: 8px 0 0; break-before: avoid; }
  .cover-subtitle { font-size: 18pt; margin: 0 0 18px; color: #1f5fa8; }
  .cover-lead { font-size: 12pt; max-width: 150mm; margin-bottom: 26px; }
  .cover-meta { width: auto; font-size: 10pt; }
  .cover-meta th { width: 30mm; }
  .cover-note { margin-top: 18px; font-size: 9pt; color: #555; }
  /* Sommaire */
  .toc h2 { font-size: 15pt; border-bottom: 2px solid #1f5fa8; padding-bottom: 3px; }
  .toc-list { list-style: none; padding: 0; columns: 1; }
  .toc-list li { display: flex; justify-content: space-between; border-bottom: 1px dotted #bbb; padding: 1px 0; }
  .toc-list a { color: inherit; text-decoration: none; }
  .toc-1 { font-weight: bold; margin-top: 5px !important; }
  .toc-2 { padding-left: 14px !important; font-size: 8.8pt; }
  .figure-row { display: flex; justify-content: center; align-items: flex-start; gap: 4%; flex-wrap: wrap; }
  .figure-row figcaption { flex-basis: 100%; }
</style>
<script src="node_modules/mermaid/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: true, theme: "neutral", fontFamily: "Arial", securityLevel: "loose",
    flowchart: { useMaxWidth: true, htmlLabels: true, subGraphTitleMargin: { top: 8, bottom: 8 } }, sequence: { useMaxWidth: true, mirrorActors: false, actorMargin: 40, width: 130, messageFontSize: 15, actorFontSize: 15, noteFontSize: 14, boxMargin: 6 } });
</script>
</head>
<body>
{{BODY}}
</body>
</html>
